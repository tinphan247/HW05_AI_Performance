<text x="712" y="310" font-family="Segoe UI, Arial" font-size="12" fill="#333">Yes</text>
<line x1="700" y1="386" x2="700" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="700" y1="476" x2="700" y2="510" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="700" y1="566" x2="700" y2="610" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="700" y1="680" x2="700" y2="720" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="700" y1="776" x2="700" y2="803" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="700" y1="927" x2="700" y2="980" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="712" y="955" font-family="Segoe UI, Arial" font-size="12" fill="#333">No</text>
<line x1="905" y1="865" x2="1030" y2="865" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="930" y="850" font-family="Segoe UI, Arial" font-size="12" fill="#333">Yes</text>
<line x1="1180" y1="900" x2="1180" y2="940" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1180" y1="996" x2="1180" y2="1025" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1180" y1="1135" x2="1180" y2="1170" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1192" y="1157" font-family="Segoe UI, Arial" font-size="12" fill="#333">Yes</text>
<line x1="1030" y1="1085" x2="880" y2="1010" stroke="#333" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="760" y="1055" font-family="Segoe UI, Arial" font-size="12" fill="#333">No: pass with warning</text>
<line x1="390" y1="618" x2="520" y2="640" stroke="#333" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="405" y="618" font-family="Segoe UI, Arial" font-size="12" fill="#333">artifacts</text>
<line x1="390" y1="718" x2="520" y2="665" stroke="#333" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="405" y="700" font-family="Segoe UI, Arial" font-size="12" fill="#333">artifacts</text>
<rect x="1010" y="40" width="350" height="80" fill="#fafafa" stroke="#ccc"/>
<text x="1025" y="62" font-family="Segoe UI" font-size="13" font-weight="bold">Legend</text>
<rect x="1025" y="74" width="18" height="14" fill="#eaf1f8" stroke="#1f4e79"/>
<text x="1052" y="86" font-family="Segoe UI" font-size="12">process</text>
<polygon points="1140,74 1158,81 1140,88 1122,81" fill="#fff4e0" stroke="#b36b00"/>
<text x="1168" y="86" font-family="Segoe UI" font-size="12">decision</text>
<line x1="1250" y1="81" x2="1300" y2="81" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1308" y="86" font-family="Segoe UI" font-size="12">async</text>
