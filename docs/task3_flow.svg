<line x1="510" y1="225" x2="390" y2="225" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="400" y="212" font-family="Segoe UI, Arial" font-size="12" fill="#333">No (docs only)</text>
