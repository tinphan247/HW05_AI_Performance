<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1260" viewBox="0 0 1400 1260">
<defs><marker id='arrow' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#333'/></marker></defs>
<rect width="1400" height="1260" fill="#ffffff"/>
<text x="40" y="42" font-family="Segoe UI, Arial" font-size="24" font-weight="bold" fill="#1f4e79">Continuous performance testing — PR gate, nightly and release flow</text>
<text x="40" y="68" font-family="Segoe UI, Arial" font-size="13" fill="#555">Short deterministic PR gate; expensive Stress/Spike/Endurance runs move to schedules.</text>
<rect x="520" y="100" width="360" height="56" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
<text x="700.0" y="128.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">Push / pull request</text>
<polygon points="700,170 890,225 700,280 510,225" fill="#fff4e0" stroke="#b36b00" stroke-width="2"/>
<text x="700" y="216" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#111">Runtime-affecting path</text>
<text x="700" y="234" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#111">or perf:full label?</text>
<rect x="90" y="200" width="300" height="64" rx="8" fill="#eeeeee" stroke="#666" stroke-width="2"/>
<text x="240.0" y="223.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">Skip perf gate</text>
<text x="240.0" y="241.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">unit + functional smoke</text>
<rect x="520" y="330" width="360" height="56" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
<text x="700.0" y="349.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">Provision clean SUT</text>
<text x="700.0" y="367.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">fixed commit + fixed dataset</text>
<rect x="520" y="420" width="360" height="56" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
<text x="700.0" y="439.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">Health check + seed</text>
<text x="700.0" y="457.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">500 users / 205 products</text>
<rect x="520" y="510" width="360" height="56" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
<text x="700.0" y="529.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">Warm-up 60 s + smoke load 5 min</text>
<text x="700.0" y="547.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">same runner, think time, dataset</text>
<rect x="520" y="610" width="360" height="70" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
<text x="700.0" y="636.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">Collect JTL + HTML + resource CSV</text>
<text x="700.0" y="654.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">write SHA-256 manifest</text>
<rect x="520" y="720" width="360" height="56" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
<text x="700.0" y="739.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">Analyse p50/p95/p99, error %, RPS</text>
<text x="700.0" y="757.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">exclude expected 4xx</text>
<polygon points="700,803 905,865 700,927 495,865" fill="#fff4e0" stroke="#b36b00" stroke-width="2"/>
<text x="700" y="865" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#111">Regression vs baseline?</text>
<rect x="520" y="980" width="360" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="700.0" y="999.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">PASS</text>
<text x="700.0" y="1017.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">store artifact, update baseline</text>
<rect x="1030" y="830" width="300" height="70" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="1180.0" y="856.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">FAIL gate</text>
<text x="1180.0" y="874.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">PR comment + artifact links</text>
<rect x="1030" y="940" width="300" height="56" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
<text x="1180.0" y="959.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">Developer investigates</text>
<text x="1180.0" y="977.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">re-run once to rule out noise</text>
<polygon points="1180,1025 1330,1080 1180,1135 1030,1080" fill="#fff4e0" stroke="#b36b00" stroke-width="2"/>
<text x="1180" y="1071" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#111">Confirmed</text>
<text x="1180" y="1089" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#111">twice?</text>
<rect x="1030" y="1170" width="300" height="56" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="1180.0" y="1189.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">Block merge / open</text>
<text x="1180.0" y="1207.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">performance issue</text>
<rect x="90" y="590" width="300" height="56" rx="8" fill="#e8f0fe" stroke="#1a4d8f" stroke-width="2"/>
<text x="240.0" y="609.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">Nightly: stress 6 steps</text>
<text x="240.0" y="627.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">+ 15 min soak</text>
<rect x="90" y="690" width="300" height="56" rx="8" fill="#e8f0fe" stroke="#1a4d8f" stroke-width="2"/>
<text x="240.0" y="709.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">Weekly / release candidate:</text>
<text x="240.0" y="727.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#111">full Load + Stress + Spike</text>
